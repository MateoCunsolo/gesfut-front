<section><header class="page-heading"><span class="eyebrow">Historial del equipo</span><h2>{{teamName}}</h2><button type="button" class="button-secondary" (click)="back()">Volver a equipos</button></header><div class="match-feed">@for(match of matches;track match.id){<app-match-card [match]="match" [roundLabel]="'Fecha '+(match.numberOfMatchDay+1)"/>}@empty{<div class="empty-state">Todavía no hay partidos para este equipo.</div>}</div></section>
