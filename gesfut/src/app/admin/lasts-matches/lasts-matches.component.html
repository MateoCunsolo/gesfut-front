<section><header class="page-heading history-heading"><div>@if(tournamentLabel){<span class="eyebrow">{{tournamentLabel}}</span>}@else{<span class="eyebrow">Historial del equipo</span>}<h2>{{teamLabel}}</h2></div><button type="button" class="button-secondary" (click)="back()">Volver a equipos</button></header>
<div class="history-filter" role="group" aria-label="Filtrar partidos"><button type="button" [class.selected]="filter==='played'" [attr.aria-pressed]="filter==='played'" (click)="filter='played'">Jugados ({{played.length}})</button><button type="button" [class.selected]="filter==='upcoming'" [attr.aria-pressed]="filter==='upcoming'" (click)="filter='upcoming'">Próximos ({{upcoming.length}})</button></div>
<div class="match-feed">@for(match of (filter==='played' ? played : upcoming);track match.id){<app-match-card [match]="match" [compact]="true" [roundLabel]="'Fecha '+(match.numberOfMatchDay+1)"/>}@empty{<div class="empty-state">{{filter==='played' ? 'Todavía no hay partidos jugados para este equipo.' : 'No hay partidos próximos para este equipo.'}}</div>}</div></section>
