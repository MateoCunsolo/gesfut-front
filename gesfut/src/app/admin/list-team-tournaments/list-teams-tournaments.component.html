<section><header class="page-heading"><h2>Equipos y jugadores</h2></header><div class="team-layout"><aside class="team-picker"><div class="team-search" [class.mobile-hidden]="participants.length <= 8"><label for="team-search">Buscar equipo</label><input aria-label="Nombre del equipo" id="team-search" type="search" placeholder="Nombre del equipo" (input)="searchTeams($event)"></div><label class="mobile-label" for="team-choice">Equipo</label><select id="team-choice" class="mobile-choice" (change)="showParticipantsFromOptional($event)" [ngModel]="teamParticipant.idParticipant">@for(team of particpantsFilter;track team.idParticipant){<option [value]="team.idParticipant">{{team.name}}</option>}</select><div class="desktop-team-list">@for(team of particpantsFilter;track team.idParticipant){<button type="button" [class.selected]="team.idParticipant===teamParticipant.idParticipant" [attr.aria-pressed]="team.idParticipant===teamParticipant.idParticipant" (click)="showParticipants(team.idParticipant)">{{team.name}}<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>}@empty{<p class="empty-state">No se encontraron equipos.</p>}</div></aside><div class="team-details"><div class="team-title"><span class="jersey"><i class="fa-solid fa-shirt" aria-hidden="true" [style.color]="colorSelected"></i></span><div><h3>{{teamParticipant.name}}</h3></div></div><app-players-tournament [teamParticipant]="teamParticipant" [code]="tournament.code"/></div></div></section>
