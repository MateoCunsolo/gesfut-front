<main class="admin-dashboard"><header class="page-heading"><h1>Panel central</h1></header><section class="dashboard-actions"><button type="button" class="dashboard-link" (click)="changeComponent('list-tournaments')"><i class="fa-solid fa-trophy" aria-hidden="true"></i><span><strong>Mis torneos</strong><small>Calendario, resultados y clasificación</small></span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button><button type="button" class="dashboard-link" (click)="changeComponent('list-teams')"><i class="fa-solid fa-users" aria-hidden="true"></i><span><strong>Mis equipos</strong><small>Planteles y estadísticas de los jugadores</small></span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button></section><div class="page-actions"><button type="button" class="base-button" (click)="changeComponent('create-tournament')"><i class="fa-solid fa-plus" aria-hidden="true"></i> Crear torneo</button><button type="button" class="button-secondary" (click)="changeComponent('create-team')">Crear equipo</button></div>@if(flagIsMyTournament){<section class="last-tournament"><span class="eyebrow">Retomar último torneo</span><button type="button" class="resume-tournament" (click)="toTournament(lastTournamentClicked)">{{lastTournamentClickedName}} <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button></section>}@if(activeTournaments().length){<section class="active-tournaments" aria-labelledby="active-heading"><div class="section-lead"><h2 id="active-heading">Torneos en curso</h2>@if(activeCount() > activeTournaments().length){<button type="button" class="text-link" (click)="changeComponent('list-tournaments')">Ver los {{activeCount()}}</button>}</div><ul>@for(t of activeTournaments();track t.code){<li><button type="button" class="active-item" [attr.aria-label]="'Abrir torneo ' + t.name" (click)="openTournament(t.code, t.name)"><strong>{{t.name}}</strong><small>{{t.startDate ? (t.startDate | date:'dd MMM yyyy') : 'Sin fecha de inicio'}}</small><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button></li>}</ul></section>}</main>
