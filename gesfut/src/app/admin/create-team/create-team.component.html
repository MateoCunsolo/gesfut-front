<section>

  <h2 class="title">Crear equipo</h2>

  <div *ngIf="error" class="error-message"><p class="error">{{ error }}</p></div>

  <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">

    <div class="team-form">
      <div class="form-group input-icon input-large">
        <input aria-label="Nombre del equipo" id="teamName" type="text" formControlName="name" placeholder="Nombre" />
        <i class="fa-solid fa-shield"></i>
      </div>
      <div class="form-group input-icon input-large">
        <input aria-label="Color del equipo" id="teamColor" type="color" formControlName="color" placeholder="Color del equipo" />
        <i class="fa-solid fa-palette"></i>
      </div>
    </div>

    <div class="player-form-header">
      <h3>Jugadores</h3>
      <button type="button" (click)="toggleExcelUpload()" class="base-button add-player-button" type="button">
        <i class="fa-solid fa-file-excel"></i>
        {{ showExcelUpload ? 'Cerrar importación' : 'Importar Excel' }}
      </button>
      <button type="button" class="base-button add-player-button" (click)="addPlayer()" [disabled]="showExcelUpload" type="button">
        <i class="fa-solid fa-user-plus"></i><p>Agregar jugador</p>
      </button>
    </div>


    <div formArrayName="players" class="players-form" >
      <app-excel-upload *ngIf="showExcelUpload" (dataLoaded)="loadTeamData($event)"></app-excel-upload>
      <div class="players-list" *ngIf="!showExcelUpload">
        <ng-container *ngIf="players.length === 0"><p>No hay jugadores en el equipo.</p></ng-container>
        <div *ngFor="let player of players.controls; let i = index" [formGroupName]="i" class="player-row">
          <div class="form-group input-icon">
            <input aria-label="Nombre" id="playerName-{{ i }}" type="text" formControlName="name" placeholder="Nombre" />
            <i class="fas fa-user"></i>
          </div>
          <div class="form-group input-icon">
            <input aria-label="Apellido" id="playerLastName-{{ i }}" type="text" formControlName="lastName" placeholder="Apellido" />
            <i class="fas fa-user"></i>
          </div>
          <div class="form-group input-icon">
            <input aria-label="Dorsal" id="playerNumber-{{ i }}" type="number" formControlName="number" placeholder="Dorsal" />
            <i class="fa-solid fa-hashtag"></i>
          </div>
          <div class="mini-group">
            <div class="check-group">
              <div class="form-group"><label class="player-role-choice"><input aria-label="Capitán" type="checkbox" formControlName="isCaptain" /><span>Capitán</span></label></div>
              <div class="form-group"><label class="player-role-choice"><input aria-label="Arquero" type="checkbox" formControlName="isGoalKeeper" /><span>Arquero</span></label></div>
            </div>
            <button type="button" aria-label="Quitar jugador del formulario" (click)="removePlayer(i)" class="icon-action icon-action--danger button-small" >
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-container">
      <button class="back-button" type="button" (click)="changeComponent('dashboard')">Volver</button>

      @if (isloading) {
        <div class="spin">
          <app-spinner ></app-spinner>
        </div>
      }@else {
        <button type="submit" class="base-button" [disabled]="noPlayers">Crear equipo</button>
      }

    </div>
  </form>
</section>
