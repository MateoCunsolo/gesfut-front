<header>
  <div class="brand"><button type="button" class="wordmark" (click)="changeComponent('dashboard')">GESFUT<span class="brand-dot" aria-hidden="true"></span></button>
    @if(routeActive()) { <button type="button" class="panel-link" (click)="changeComponent('dashboard-principal')"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver al panel central</button> }
  </div>
  @if (!isLoggedIn && !guest) { <button class="btn-login" (click)="onLogin()">Ingresar</button> }
  @else if (isLoggedIn) { <app-user /> }
</header>
