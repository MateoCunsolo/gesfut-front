<section class="landing">
  <div class="copy">
    <span class="eyebrow">Gesfut · Gestión de fútbol</span>
    <h1>Tu torneo.<br>Todos los partidos.<br><em>En un mismo lugar.</em></h1>
    <p>Organizá equipos y encuentros. Compartí resultados, posiciones y protagonistas para que todos sigan el torneo desde su celular.</p>
    <button type="button" class="start base-button" (click)="toRegister()">Organizar un torneo <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    <div class="lookup">
      <label class="lookup-label" for="tournament-code">¿Te compartieron un torneo?</label>
      <div class="lookup-row">
        <input id="tournament-code" type="text" inputmode="url" autocomplete="off" [value]="code" (input)="code = $any($event.target).value; codeError = ''" (keydown.enter)="viewTournament()" placeholder="Pegá el código o el link" [attr.aria-invalid]="!!codeError" aria-describedby="tournament-code-help" />
        <button type="button" class="back-button" (click)="viewTournament()">Ver torneo</button>
      </div>
      <p class="lookup-help" id="tournament-code-help" aria-live="polite">{{ codeError || 'No hace falta tener cuenta para ver tablas y resultados.' }}</p>
    </div>
  </div>
  <svg class="preview" viewBox="0 0 320 300" role="img" aria-label="Ejemplo de tabla y resultado de un torneo en Gesfut">
    <rect x="1" y="1" width="318" height="298" rx="14" class="card" />
    <rect x="16" y="16" width="288" height="72" rx="10" class="soft" />
    <text x="32" y="44" class="label">Fecha 5 · Finalizado</text>
    <text x="32" y="72" class="team">Los Pibes</text>
    <text x="288" y="72" class="score" text-anchor="end">3 – 1</text>
    <text x="16" y="120" class="label">Clasificación</text>
    <text x="288" y="120" class="label" text-anchor="end">Pts</text>
    <g class="rows">
      <rect x="16" y="132" width="288" height="44" rx="10" class="soft" />
      <text x="32" y="160" class="pos">1</text><text x="56" y="160" class="team">Los Pibes</text><text x="288" y="160" class="pts" text-anchor="end">13</text>
      <line x1="16" y1="220" x2="304" y2="220" class="line" />
      <text x="32" y="204" class="pos">2</text><text x="56" y="204" class="team">Deportivo Barrio</text><text x="288" y="204" class="pts" text-anchor="end">11</text>
      <text x="32" y="248" class="pos">3</text><text x="56" y="248" class="team">Unión del Sur</text><text x="288" y="248" class="pts" text-anchor="end">9</text>
      <line x1="16" y1="264" x2="304" y2="264" class="line" />
    </g>
    <circle cx="288" cy="40" r="6" class="dot" />
  </svg>
</section>
